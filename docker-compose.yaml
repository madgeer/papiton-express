version: '3.8'

services:
  inventory-warehouse-app:
    build:
      context: ./warehouse-and-inventory-service
      dockerfile: Dockerfile
    container_name: warehouse-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=papiton_warehouse
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warehouse-net

  db:
    image: postgres:15-alpine
    container_name: warehouse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: papiton_warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d papiton_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - warehouse-net

networks:
  warehouse-net:
    driver: bridge

volumes:
  pgdata:
