version : '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: order_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_tariff_db
    ports:
      - "5432:5432"
  redis:
    image: redis:alpine
    container_name: order_redis
    ports:
      - "6379:6379"